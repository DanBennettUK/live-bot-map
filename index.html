<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#07080d">
  <meta name="description" content="Live map of every Grok Bot Dan Bennett runs.">
  <title>Live Bot Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%2307080d' stroke='%237af0c8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%237af0c8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@380;500;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="map">
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <span class="live-badge" id="liveBadge" data-state="waiting">
        <span class="live-dot"></span>
        <span class="live-text">CONNECTING</span>
        <span class="live-age" id="liveAge"></span>
      </span>
      <div class="titles">
        <h1>Live Bot Map</h1>
        <p>Every Grok Bot Dan Bennett runs</p>
      </div>
    </div>
    <dl class="stats" id="stats"></dl>
    <div class="controls">
      <label class="search">
        <span class="sr-only">Search bots</span>
        <input type="search" id="search" placeholder="Search bots" autocomplete="off" spellcheck="false">
      </label>
      <nav class="view-toggle" aria-label="Views">
        <a class="active" href="./" aria-current="page">Map</a>
        <a href="list.html">List</a>
      </nav>
    </div>
  </header>
  <div class="filters" id="filters" role="tablist" aria-label="Cluster filters"></div>
  <main class="stage">
    <svg id="map" viewBox="0 0 1280 800" role="img" aria-label="Animated map of bots by cluster"></svg>
    <aside class="detail" id="detail" hidden></aside>
    <p class="status-msg" id="statusMsg">Loading the fleet…</p>
  </main>
  <footer class="ticker" aria-label="Live activity">
    <span class="ticker-label">Activity</span>
    <div class="ticker-viewport">
      <div class="ticker-track" id="ticker"></div>
    </div>
  </footer>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
